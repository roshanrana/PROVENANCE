name: BARRIER cluster

# The S-02 spike, run in public.
#
# BARRIER's entire attack rests on a premise nobody has tested: can an ordinary
# API caller observe anything that distinguishes a cache hit from a miss? Until
# this workflow existed, answering it meant an evening on someone's laptop with
# Docker Desktop, and the answer would have been a paragraph in a README that a
# reviewer had to take on trust.
#
# Everything the topology needs — Docker, kind, kubectl, helm, ko, Go — is
# available on a stock ubuntu-latest runner, and `up.sh` was already written for
# an operator who is not watching: it fails loudly and writes its own transcript.
# So the spike runs here, on every push, and the log is the evidence.
#
# It is deliberately NOT part of `make check`. CI's check job is a mirror of the
# local gate (see ci.yml) and adding a ten-minute cluster build to it would make
# the fast feedback loop slow enough that people stop running it.

on:
  push:
    branches: [main]
    paths:
      - "barrier/**"
      - ".github/workflows/barrier.yml"
  pull_request:
    paths:
      - "barrier/**"
      - ".github/workflows/barrier.yml"
  workflow_dispatch:
    inputs:
      profile:
        description: "default (the leaking config) or hardened (the mitigation)"
        required: false
        default: "default"
        type: choice
        options: [default, hardened]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  spike:
    name: "S-02 spike (${{ matrix.profile }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Both profiles, every push. The diff between them IS the deliverable
      # (values-default.yaml vs values-hardened.yaml), and for eleven runs only
      # `default` had ever been executed — so the mitigation was tested code
      # that had never met the thing it mitigates. A workflow that runs only the
      # unmitigated half cannot notice that the hardened half does not start.
      matrix:
        profile: ${{ inputs.profile && fromJSON(format('["{0}"]', inputs.profile)) || fromJSON('["default","hardened"]') }}
    # Generous, because a first run pulls the simulator image and builds the EPP
    # from source. A timeout that trips on a cold cache reads as a broken spike.
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      # llm-d-router v0.10.0 declares `go 1.26.6` and the EPP image is built from
      # source every time — a stale image is exactly the thing that makes a
      # hardened run silently behave like a default one (ADR-008).
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.6"
          cache-dependency-path: barrier/epp/go.sum

      - name: Install kind, ko and helm
        run: |
          set -euo pipefail
          go install sigs.k8s.io/kind@latest
          go install github.com/google/ko@latest
          curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python
        run: uv python install

      - name: Sync dependencies
        run: uv sync --frozen

      # Invoked as `bash up.sh`, not `./up.sh`. The exec bit was missing from the
      # committed file and the first CI run died with exit 126 — "found, not
      # executable" — after 1m21s, before touching Docker. The mode is fixed in
      # the same commit, but a repo that is edited on Windows will lose it again,
      # and a workflow that cannot survive that is a workflow that fails for a
      # reason unrelated to the thing it tests.
      - name: Bring up the topology
        run: bash up.sh "${{ matrix.profile }}"
        working-directory: barrier/deploy/kind

      - name: Port-forward the gateway
        run: |
          set -euo pipefail
          kubectl -n provenance port-forward svc/provenance-gateway 8080:80 &
          # Wait for the forward rather than sleeping a fixed amount: a fixed
          # sleep either wastes runner minutes or races a slow rollout.
          #
          # ANY HTTP status counts as up, including 503. The gateway routes
          # through an ORIGINAL_DST cluster whose destination the EPP chooses per
          # request, so a bare `GET /` is *expected* to 503 — there is no default
          # backend. `curl -sf` treats that as failure, so the earlier form here
          # would have waited the full two minutes and then declared a healthy
          # gateway dead.
          for _ in $(seq 1 60); do
            curl -s -o /dev/null -w '%{http_code}' --max-time 3 http://localhost:8080/ \
              | grep -qE '^[1-5][0-9][0-9]$' && break
            sleep 2
          done
          echo "gateway answered: $(curl -s -o /dev/null -w '%{http_code}' --max-time 3 http://localhost:8080/ || echo none)"

      # The spike's decision rule was fixed in advance (LLD §7) and travels
      # inside its own evidence file, so a result cannot be rationalised after
      # the fact. Both outcomes are publishable: no client-observable signal
      # rescopes FR-B-03 to an instrumented demonstration, which the
      # requirements were written to survive (NFR-17).
      # --repeats 200 gives n=402 per continuous channel. Fixed HERE, before the
      # run that gets recorded, and it is a power decision rather than a
      # threshold one: runs #8 and #11 both put the latency AUC point estimate
      # above chance (0.556, 0.620) with an interval that straddled it, which is
      # what n=62 looks like when it cannot resolve an effect of that size.
      # Reporting "no signal" from that would overstate what the data supports;
      # so would re-running at 62 until an interval happened to land clear of
      # chance. n=402 is chosen once, and the verdict it returns is the verdict
      # recorded, whichever way it goes.
      - name: Run the S-02 spike
        run: |
          set -euo pipefail
          # The hardened gateway authenticates, so the client needs the keys the
          # proxy issued. up.sh writes them under .secrets/ — deliberately NOT
          # under bench/results/, which is uploaded wholesale as an artifact.
          uv run python -m barrier.attack.spike_s02 \
            --gateway http://localhost:8080 --repeats 200 \
            --key-a "$(cat .secrets/tenant-keys/tenant-a)" \
            --key-b "$(cat .secrets/tenant-keys/tenant-b)"

      # The spike says so itself, in every run: "a spike that only looked
      # client-side cannot tell 'no signal' from 'we did not look'." A verdict of
      # NO CLIENT-OBSERVABLE SIGNAL is only worth anything if the router actually
      # had something to signal — if the prefix index never recorded a match,
      # then the run measured a broken configuration and called it a security
      # property. So the EPP's own view is captured, and the job FAILS if it
      # cannot be captured, rather than letting the verdict stand unbacked.
      - name: Capture the EPP's ground truth
        run: |
          set -euo pipefail
          mkdir -p bench/results/epp-ground-truth
          kubectl -n provenance port-forward svc/provenance-epp 9090:9090 &

          # Any HTTP status means the port-forward is up. `curl -sf` was used
          # here and it treats a 401 as failure, so run #9 waited out the whole
          # loop against a perfectly healthy endpoint and then died with exit 22
          # — a diagnostic that said nothing about the EPP (F-25).
          for _ in $(seq 1 30); do
            code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 3 http://localhost:9090/metrics || true)"
            [ "$code" != "000" ] && [ -n "$code" ] && break
            sleep 1
          done
          echo "metrics endpoint answered: ${code:-none}"
          curl -s http://localhost:9090/metrics > bench/results/epp-ground-truth/metrics.txt || true
          kubectl -n provenance logs -l app=provenance-epp --tail=3000 \
            > bench/results/epp-ground-truth/epp.log

          echo "--- prefix index metrics ---"
          grep -E 'prefix_indexer' bench/results/epp-ground-truth/metrics.txt | grep -v '^#' || true
          echo "--- scheduling activity in the EPP log ---"
          grep -icE 'prefix|scored|picked|endpoint' bench/results/epp-ground-truth/epp.log || true

          # The assertion is in committed, unit-tested code rather than in a
          # grep here. The grep version passed on a plugin *named* prefix having
          # executed, which proves nothing about whether the index ever matched
          # (F-26) — and a gate that cannot be tested is a gate nobody has
          # checked. `barrier.attack.ground_truth` reads the hit-ratio histogram
          # and requires a non-zero match; exit 5 means the spike's verdict must
          # not be recorded from this run.
          uv run python -m barrier.attack.ground_truth \
            bench/results/epp-ground-truth/metrics.txt

      - name: Collect cluster state on failure
        if: failure()
        run: |
          kubectl -n provenance get pods -o wide || true
          kubectl -n provenance describe pods || true
          kubectl -n provenance logs -l app=provenance-epp --tail=200 || true
          kubectl -n provenance logs -l app=provenance-sim --tail=100 || true
          # The gateway's own log is where an ext_proc misconfiguration shows up
          # — Envoy refuses to start on an unknown field, and without this the
          # symptom is a silent CrashLoopBackOff (F-18).
          kubectl -n provenance logs -l app=provenance-gateway --tail=200 || true
          kubectl -n provenance logs -l app=provenance-gateway -c render-config --tail=20 || true
          kubectl -n provenance get events --sort-by=.lastTimestamp | tail -40 || true

      # The transcript IS the deliverable. up.sh writes rendered manifests and a
      # manifest.json carrying the values hash, so a reader can see exactly what
      # ran rather than re-deriving it from a chart version (ADR-004).
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: barrier-evidence-${{ matrix.profile }}
          path: bench/results/
          if-no-files-found: warn

      - name: Tear down
        if: always()
        run: kind delete cluster --name provenance || true
