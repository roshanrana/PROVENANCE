{{/*
  The proxy — and therefore the trust boundary (docs/threat-model.md §3).

  Two things live here, and F-18 was that neither of them did.

  1. THE EXT_PROC FILTER. The EPP is an Envoy external processor: Envoy hands it
     the request headers and body, it picks an endpoint and answers with
     `x-gateway-destination-endpoint`, and Envoy forwards there via an
     ORIGINAL_DST cluster. Until this filter existed the EPP was deployed,
     healthy, and *not in the request path* — so the tenant-salt plugin could
     never run, and `default` and `hardened` would have produced byte-identical
     results while the writeup called one of them a mitigation. That is the
     single worst failure mode available to this project, and it survived
     unnoticed because nothing had ever stood the topology up.

  2. stripInboundHeaders, the load-bearing line of the hardened profile. It was
     rendered under `route:` — that is `RouteAction`, which has no such field.
     Envoy rejects an unknown field at boot, so the hardened gateway would have
     crash-looped. It belongs on the `Route`, one level up, and now sits there.

  `request_body_mode: FULL_DUPLEX_STREAMED` is not a preference: llm-d's README
  states it is the only supported mode, and it needs Envoy >= 1.33 — hence the
  pinned image below rather than the v1.31 tag this file used to carry.
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: provenance-gateway-config
data:
  # A TEMPLATE, not the config. `__KEY_TENANT_A__` and friends are substituted
  # at pod start by an init container reading the tenant Secrets.
  #
  # The alternative — passing the keys to `helm --set` — would put live tenant
  # credentials into `rendered.yaml`, which up.sh commits as evidence (ADR-004).
  # A repository whose subject is tenant isolation cannot publish the tenant
  # keys next to the results, and CLAUDE.md forbids it outright. So the
  # committed artefact shows the placeholders and the substitution is visible in
  # the pod spec below, which is strictly more auditable than a literal.
  envoy.yaml.tmpl: |
    admin:
      address:
        socket_address: { address: 127.0.0.1, port_value: 19000 }
    static_resources:
      listeners:
        - address:
            socket_address: { address: 0.0.0.0, port_value: 8080 }
          filter_chains:
            - filters:
                - name: envoy.filters.network.http_connection_manager
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                    stat_prefix: provenance
                    route_config:
                      name: provenance
                      virtual_hosts:
                        - name: all
                          domains: ["*"]
                          routes:
                            {{- if .Values.proxy.injectIdentityHeader }}
                            {{/*
                              ADR-006. One route per tenant, matched on the API
                              key the proxy issued.

                              The mutation is a `header_mutation` PER-FILTER
                              config, NOT route-level `request_headers_to_add`.
                              That distinction is the whole of F-27 and it is not
                              a style preference: **route-level header mutations
                              are applied by the ROUTER filter, at the end of the
                              chain, so ext_proc never sees them.** The EPP was
                              therefore reading whatever the client sent, and run
                              #13 looked fine only because the S-02 client sends
                              `x-llmd-tenant` itself. A client that omits it got
                              `tenant-salt: no authenticated tenant identity` and
                              a 500 — which is fail-closed working, on an
                              injection that had never worked.

                              `header_mutation` is an ordinary HTTP filter, so
                              its per-route mutations run at ITS position in the
                              chain. Placed before ext_proc below, they are
                              exactly what the EPP reads.
                            */}}
                            {{- $strip := without .Values.proxy.stripInboundHeaders .Values.proxy.injectIdentityHeader }}
                            {{- range .Values.tenants }}
                            - match:
                                prefix: "/"
                                headers:
                                  - name: authorization
                                    string_match:
                                      exact: "Bearer __KEY_{{ .name | upper | replace "-" "_" }}__"
                              typed_per_filter_config:
                                envoy.filters.http.header_mutation:
                                  "@type": type.googleapis.com/envoy.extensions.filters.http.header_mutation.v3.HeaderMutationPerRoute
                                  mutations:
                                    request_mutations:
                                      {{- range $strip }}
                                      # Distrusted inbound headers, dropped
                                      # before the EPP is asked anything.
                                      - remove: {{ . }}
                                      {{- end }}
                                      - append:
                                          header:
                                            key: {{ $.Values.proxy.injectIdentityHeader }}
                                            value: {{ .name }}
                                          append_action: OVERWRITE_IF_EXISTS_OR_ADD
                              route:
                                cluster: original_destination_cluster
                                timeout: 300s
                                idle_timeout: 300s
                            {{- end }}
                            # Anything that did not authenticate. Refused here
                            # rather than routed with no identity: an
                            # unauthenticated request reaching the EPP would be
                            # salted with the empty string, which is the shared
                            # default namespace — the exposure being closed,
                            # arrived at by a path that looks like success.
                            - match: { prefix: "/" }
                              direct_response:
                                status: 401
                                body:
                                  inline_string: "unauthenticated: no tenant credential\n"
                            {{- else }}
                            # DEFAULT profile: one route, no authentication, and
                            # x-llmd-tenant is whatever the client said it was.
                            # Not a strawman — it is what the upstream quickstart
                            # gives you, and NFR-18 depends on that being true.
                            - match: { prefix: "/" }
                              {{- with .Values.proxy.stripInboundHeaders }}
                              request_headers_to_remove:
                              {{- range . }}
                                - {{ . }}
                              {{- end }}
                              {{- end }}
                              route:
                                # The destination is chosen by the EPP, not by
                                # this config. That is the whole point of the
                                # topology: routing is prefix-affinity-driven.
                                cluster: original_destination_cluster
                                timeout: 300s
                                idle_timeout: 300s
                            {{- end }}
                    http_filters:
                      {{- if .Values.proxy.injectIdentityHeader }}
                      # FIRST, and that placement is the mitigation. A filter's
                      # per-route mutations run at the filter's own position, so
                      # everything ext_proc reads below has already had the
                      # client's identity claim removed and the proxy's own
                      # substituted (F-27).
                      - name: envoy.filters.http.header_mutation
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.header_mutation.v3.HeaderMutation
                      {{- end }}
                      - name: envoy.filters.http.ext_proc
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.ext_proc.v3.ExternalProcessor
                          grpc_service:
                            envoy_grpc:
                              cluster_name: ext_proc
                              authority: provenance-epp.{{ .Release.Namespace }}:9002
                            timeout: 10s
                          # Fail CLOSED. An EPP that is down must produce a 5xx,
                          # not a request that quietly bypasses the plugin: a
                          # hardened run that silently degraded to unsalted
                          # routing would publish the mitigation as working when
                          # it was not running at all.
                          failure_mode_allow: false
                          processing_mode:
                            request_header_mode: SEND
                            response_header_mode: SEND
                            request_body_mode: FULL_DUPLEX_STREAMED
                            response_body_mode: FULL_DUPLEX_STREAMED
                            request_trailer_mode: SEND
                            response_trailer_mode: SEND
                          message_timeout: 60s
                      - name: envoy.filters.http.router
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
      clusters:
        # Destination IP:port comes from the header the EPP sets on the request
        # it returns. No static endpoint list: if the EPP does not pick, Envoy
        # 503s, which is the loud failure this project prefers to a quiet one.
        - name: original_destination_cluster
          type: ORIGINAL_DST
          connect_timeout: 30s
          lb_policy: CLUSTER_PROVIDED
          original_dst_lb_config:
            use_http_header: true
            http_header_name: x-gateway-destination-endpoint
        - name: ext_proc
          type: STRICT_DNS
          connect_timeout: 10s
          lb_policy: LEAST_REQUEST
          typed_extension_protocol_options:
            envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
              "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
              explicit_http_config:
                http2_protocol_options: {}
          load_assignment:
            cluster_name: ext_proc
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address:
                          address: provenance-epp.{{ .Release.Namespace }}
                          port_value: 9002
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: provenance-gateway
  labels: { app: provenance-gateway }
spec:
  replicas: 1
  selector:
    matchLabels: { app: provenance-gateway }
  template:
    metadata:
      labels: { app: provenance-gateway }
      annotations:
        provenance/proxy-sha: {{ toYaml .Values.proxy | sha256sum }}
    spec:
      # Substitutes the tenant keys into the config template. A separate
      # container because the Envoy image is distroless — no shell, nothing to
      # run a substitution with — and because keeping it separate means the
      # proxy process never has the keys in its environment.
      initContainers:
        - name: render-config
          image: busybox:1.37
          command:
            - sh
            - -c
            - |
              set -eu
              cp /etc/envoy-template/envoy.yaml.tmpl /etc/envoy/envoy.yaml
              {{- range .Values.tenants }}
              sed -i "s|__KEY_{{ .name | upper | replace "-" "_" }}__|${KEY_{{ .name | upper | replace "-" "_" }}}|g" /etc/envoy/envoy.yaml
              {{- end }}
              # Never `cat` the result. A rendered config in a pod log is every
              # tenant credential in a pod log.
              echo "config rendered ($(wc -l < /etc/envoy/envoy.yaml) lines)"
          env:
            {{- range .Values.tenants }}
            - name: KEY_{{ .name | upper | replace "-" "_" }}
              valueFrom:
                secretKeyRef:
                  name: {{ .apiKeySecret }}
                  key: key
            {{- end }}
          volumeMounts:
            - name: config-template
              mountPath: /etc/envoy-template
            - name: config
              mountPath: /etc/envoy
      containers:
        - name: envoy
          # Pinned, and pinned to >= 1.33: FULL_DUPLEX_STREAMED does not exist
          # before it, and llm-d supports no other ext_proc body mode. This is
          # the version llm-d's own e2e environments run.
          image: docker.io/envoyproxy/envoy:distroless-v1.33.2
          args: ["-c", "/etc/envoy/envoy.yaml"]
          ports: [{ containerPort: 8080 }]
          volumeMounts:
            - name: config
              mountPath: /etc/envoy
      volumes:
        - name: config-template
          configMap: { name: provenance-gateway-config }
        - name: config
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: provenance-gateway
spec:
  type: NodePort
  selector: { app: provenance-gateway }
  ports:
    - port: 80
      targetPort: 8080
      nodePort: 30080
