# DEFAULT deployment — the configuration under attack.
#
# This is stock llm-d. Nothing here is misconfigured, weakened, or strawmanned:
# it is what you get when you follow the quickstart and add a second tenant. That
# is the entire point of BARRIER, and NFR-18 depends on it — the finding is a gap
# in the DEFAULT POSTURE, not a vulnerability we introduced to then fix.
#
# Diff this against values-hardened.yaml. That diff is the deliverable.

routing:
  # The approximate path: an EPP-local LRU index of the router's own routing
  # history. It leaks even after the engine has evicted the blocks, because it
  # remembers what was routed rather than what is cached (STATE.md F-01).
  prefixCacheScorer:
    enabled: true
    blockSize: 16
    maxPrefixBlocks: 256

  schedulingProfiles:
    - name: default
      plugins:
        - pluginRef: approx-prefix-cache-producer
        - pluginRef: prefix-cache-scorer
          weight: 100
        - pluginRef: least-queue-filter

# --- The gap -----------------------------------------------------------------
#
# There is no tenant-salt plugin here, and there is nothing wrong with that: the
# upstream default has no such concept. The prefix hash chain is seeded with the
# target model plus an OPTIONAL, CLIENT-SUPPLIED cache_salt. So two tenants on the
# same model share one namespace unless every one of them remembers to set a salt
# — and even then, nothing stops another tenant from sending the same value.

proxy:
  # No header stripping. A client can set x-llmd-tenant to anything it likes;
  # nothing downstream would know. Under the default configuration that is
  # harmless, because nothing reads it. It stops being harmless the moment
  # something does — which is why ADR-006 puts stripping in the hardened profile
  # rather than treating a trusted header as free.
  stripInboundHeaders: []

tenants:
  # Synthetic personas. NFR-14: no real firms, no real MNPI, ever.
  - name: tenant-a
    displayName: "Desk A — Equity Research"
    apiKeySecret: tenant-a-key
  - name: tenant-b
    displayName: "Desk B — M&A Advisory"
    apiKeySecret: tenant-b-key
    # In a real bank an information barrier separates these two desks. The point
    # of BARRIER is that the routing layer does not know that.

modelServers:
  replicas: 2
  image: ghcr.io/llm-d/llm-d-inference-sim:latest
  model: Qwen/Qwen2.5-0.5B-Instruct
  args:
    - --port=8000
    - --model=Qwen/Qwen2.5-0.5B-Instruct
    # The simulator does not vary TTFT on cache hit vs miss (D-01, issue #347
    # closed as not-planned). So this deployment carries the ROUTING half of the
    # result; the timing oracle needs real vLLM (FR-B-09).
    - --time-to-first-token=200
    - --inter-token-latency=10

epp:
  image: provenance-epp:dev
  extraArgs: []
  logLevel: info
