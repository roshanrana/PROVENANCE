# HARDENED deployment — the mitigation.
#
# Diff this against values-default.yaml. The diff is small on purpose: the claim
# is that a real multi-tenant gap closes with one plugin and one proxy rule, not
# that llm-d needs rearchitecting. A large diff would be a weaker result.
#
# Three changes, and all three are load-bearing (LLD §4.3).

# CHANGE 1 of 3 — declare the tenant-salt plugin.
#
# It is a requestcontrol RequestHeaderProcessor, not a scheduling plugin, so it
# belongs HERE and nowhere else: declaring it activates it, and it runs after
# InferenceRequest creation but before any DataProducer computes prefix block
# hashes. Naming it as a schedulingProfile `pluginRef` — which this file used to
# do — is rejected at boot, because it implements no scheduling interface
# (STATE.md F-21). Obligations 1 and 2 of LLD §4.3.
plugins:
  - type: prefix-cache-scorer
  - type: queue-scorer
  - name: tenant-salt
    type: tenant-salt
    parameters:
      identityHeader: x-llmd-tenant

      # The HMAC key, mounted from a Kubernetes Secret — never in this file, and
      # never logged. A derived salt in a log is a forgeable credential.
      saltSecretEnv: PROVENANCE_SALT_SECRET

      # CHANGE 2 of 3 — obligation 3 (ADR-007).
      #
      # Rewrites the outbound request body's cache_salt so vLLM's OWN prefix
      # cache partitions identically. Without this the EPP routing index is
      # closed while the engine's real KV cache stays shared: the weaker half of
      # the mitigation, presented as the whole. That is worse than no mitigation,
      # because it would be published as one.
      propagateToEngine: true

      # Reject requests with absent or malformed identity rather than routing
      # them with an empty salt. An empty salt puts the caller straight back into
      # the shared default namespace — silently, and looking like success.
      failClosed: true

# Byte-identical to the default profile. That is deliberate: the mitigation must
# not change how endpoints are scored, only what namespace the hashes fall in.
# A profile diff here would confound the result.
routing:
  schedulingProfiles:
    - name: default
      plugins:
        - pluginRef: prefix-cache-scorer
          weight: 100
        - pluginRef: queue-scorer
          weight: 1

proxy:
  # CHANGE 3 of 3 — the trust boundary (ADR-006).
  #
  # The proxy authenticates, STRIPS whatever the client sent for these headers,
  # and injects the identity it vouches for. Without this line the plugin is
  # reading an attacker-controlled header and the whole mitigation is forgeable
  # at the edge — so this is not hardening around the fix, it is half of it.
  #
  # Realised as an Envoy OVERWRITE_IF_EXISTS_OR_ADD on the authenticated route
  # rather than a remove-then-add: Envoy applies request_headers_to_remove AFTER
  # request_headers_to_add, so a strip rule on the injected header would delete
  # the proxy's own vouching. Any OTHER header listed here is still removed.
  stripInboundHeaders:
    - x-llmd-tenant
  injectIdentityHeader: x-llmd-tenant

  # There is deliberately no `stripInboundBodyFields: [cache_salt]` here.
  #
  # It was declared for two releases and read by no template, which is the F-18
  # defect in miniature. Writing it now would be worse: `ApplySalt` already
  # OVERRIDES cache_salt on every body variant the prefix hasher reads, so a
  # client-supplied value is replaced rather than merely dropped. That is
  # strictly stronger than stripping, it is tested (plugin_test.go), and adding
  # a second mechanism in the proxy would mean two things could disagree about
  # which namespace a request belongs to.

tenants:
  - name: tenant-a
    displayName: "Desk A — Equity Research"
    apiKeySecret: tenant-a-key
  - name: tenant-b
    displayName: "Desk B — M&A Advisory"
    apiKeySecret: tenant-b-key

modelServers:
  replicas: 2
  # Pinned. `:latest` is not a version, and a topology whose output is
  # evidence cannot depend on an image that changes underneath it — which
  # is exactly how F-22 arrived.
  image: ghcr.io/llm-d/llm-d-inference-sim:v0.11.2
  model: Qwen/Qwen2.5-0.5B-Instruct
  args:
    - --port=8000
    - --model=Qwen/Qwen2.5-0.5B-Instruct
    # Go duration, not an integer. The simulator removed the bare-integer
    # form; `200` is rejected at startup with "missing unit in duration" and
    # the pod crash-loops (F-22).
    - --time-to-first-token=200ms
    - --inter-token-latency=10ms

epp:
  # Overridden by up.sh with the reference ko actually produced — see the same
  # note in values-default.yaml. The two profiles must run the SAME binary, or
  # the diff between them stops being the mitigation and starts being the build.
  image: provenance-epp:dev
  # tenant-salt registers as Alpha (it has not been through upstream review), so
  # the runner needs this to load it. Stating that plainly is more honest than
  # registering it as Beta to avoid the flag.
  extraArgs:
    - --allow-experimental-plugins
  logLevel: info
  env:
    - name: PROVENANCE_SALT_SECRET
      valueFrom:
        secretKeyRef:
          name: provenance-salt
          key: secret

# --- What this does NOT close ------------------------------------------------
#
# Under `precise-prefix-cache-producer` the signal also lives in the engine's real
# KV cache, streamed from vLLM over ZeroMQ. Obligation 3 above partitions that too
# — the salt reaches vLLM's own block hash (F-03) — but the residual is measured
# and reported (FR-B-08), not assumed away. Overclaiming here is the failure mode
# this project most needs to avoid.
