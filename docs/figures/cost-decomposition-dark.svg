<svg xmlns="http://www.w3.org/2000/svg" width="720" height="372" viewBox="0 0 720 372" role="img" aria-label="Caching x determinism, decomposed, on SGLang">
  <title>Caching x determinism, decomposed, on SGLang</title>
  <rect width="720" height="372" fill="#1a1a19"/>
  <text x="24.0" y="30.0" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="600" fill="#ffffff" text-anchor="start">The cost of determinism, separated from the cost of losing the cache</text>
  <text x="24.0" y="50.0" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="400" fill="#c3c2b7" text-anchor="start">SGLang on an H100, mean output tokens/second, 128 trials per cell</text>
  <rect x="150.0" y="105.9" width="76.0" height="150.1" rx="4.0" fill="#3987e5"/>
  <text x="188.0" y="95.9" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">366.0</text>
  <text x="188.0" y="274.0" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="400" fill="#c3c2b7" text-anchor="middle">cell B</text>
  <rect x="238.0" y="122.3" width="76.0" height="133.7" rx="4.0" fill="#d95926"/>
  <text x="276.0" y="112.3" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">326.2</text>
  <text x="276.0" y="274.0" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="400" fill="#c3c2b7" text-anchor="middle">cell A</text>
  <text x="232.0" y="294.0" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="400" fill="#ffffff" text-anchor="middle">determinism off</text>
  <rect x="430.0" y="133.0" width="76.0" height="123.0" rx="4.0" fill="#3987e5"/>
  <text x="468.0" y="123.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">300.1</text>
  <text x="468.0" y="274.0" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="400" fill="#c3c2b7" text-anchor="middle">cell D</text>
  <rect x="518.0" y="142.6" width="76.0" height="113.4" rx="4.0" fill="#d95926"/>
  <text x="556.0" y="132.6" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">276.5</text>
  <text x="556.0" y="274.0" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="400" fill="#c3c2b7" text-anchor="middle">cell C</text>
  <text x="512.0" y="294.0" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="400" fill="#ffffff" text-anchor="middle">determinism on</text>
  <line x1="120.0" y1="256.0" x2="680.0" y2="256.0" stroke="#3a3a38" stroke-width="1"/>
  <rect x="490.0" y="42.0" width="10.0" height="10.0" rx="2.0" fill="#3987e5"/>
  <text x="506.0" y="51.0" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="400" fill="#c3c2b7" text-anchor="start">cache off</text>
  <rect x="598.0" y="42.0" width="10.0" height="10.0" rx="2.0" fill="#d95926"/>
  <text x="614.0" y="51.0" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="400" fill="#c3c2b7" text-anchor="start">cache on</text>
  <text x="24.0" y="308.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="600" fill="#ffffff" text-anchor="start">D / B</text>
  <text x="90.0" y="308.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="600" fill="#d95926" text-anchor="start">0.820x</text>
  <text x="160.0" y="308.0" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="400" fill="#ffffff" text-anchor="start">determinism alone costs 18.0%, cache held off on both sides</text>
  <text x="24.0" y="328.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#c3c2b7" text-anchor="start">C / A</text>
  <text x="90.0" y="328.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#c3c2b7" text-anchor="start">0.848x</text>
  <text x="160.0" y="328.0" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="400" fill="#c3c2b7" text-anchor="start">both together — the only comparison a vLLM-shaped experiment can make</text>
  <text x="24.0" y="350.0" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="400" fill="#c3c2b7" text-anchor="start">The confounded number UNDERSTATES the cost here: the cache is a small penalty on this workload, not a benefit.</text>
</svg>
