<svg xmlns="http://www.w3.org/2000/svg" width="720" height="334" viewBox="0 0 720 334" role="img" aria-label="FR-B-03: the routing-index leak and its mitigation">
  <title>FR-B-03: the routing-index leak and its mitigation</title>
  <rect width="720" height="334" fill="#1a1a19"/>
  <text x="24.0" y="30.0" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="600" fill="#ffffff" text-anchor="start">The cross-tenant leak, and the mitigation closing it</text>
  <text x="24.0" y="50.0" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="400" fill="#c3c2b7" text-anchor="start">same schedule, same pre-registered rule — 40 trials per profile, n=80</text>
  <line x1="307.9" y1="100.0" x2="307.9" y2="220.0" stroke="#3a3a38" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="307.9" y="92.0" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="10" font-weight="400" fill="#c3c2b7" text-anchor="middle">chance 0.5</text>
  <line x1="404.3" y1="100.0" x2="404.3" y2="220.0" stroke="#3a3a38" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="404.3" y="92.0" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="10" font-weight="400" fill="#c3c2b7" text-anchor="middle">pre-registered bar 0.75</text>
  <text x="236.0" y="142.0" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="400" fill="#ffffff" text-anchor="end">default (stock llm-d)</text>
  <rect x="499.2" y="134.0" width="3.0" height="8.0" rx="4.0" fill="#e66767"/>
  <line x1="500.7" y1="127.0" x2="500.7" y2="149.0" stroke="#e66767" stroke-width="2"/>
  <text x="534.0" y="142.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#c3c2b7" text-anchor="start">AUC 1.0000  p=9.999e-05</text>
  <text x="236.0" y="194.0" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="400" fill="#ffffff" text-anchor="end">hardened (tenant salt)</text>
  <rect x="306.4" y="186.0" width="3.0" height="8.0" rx="4.0" fill="#199e70"/>
  <line x1="307.9" y1="179.0" x2="307.9" y2="201.0" stroke="#199e70" stroke-width="2"/>
  <text x="534.0" y="194.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#c3c2b7" text-anchor="start">AUC 0.5000  at chance</text>
  <rect x="250.0" y="62.0" width="10.0" height="10.0" rx="2.0" fill="#e66767"/>
  <text x="266.0" y="71.0" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="400" fill="#c3c2b7" text-anchor="start">attack succeeds</text>
  <rect x="380.0" y="62.0" width="10.0" height="10.0" rx="2.0" fill="#199e70"/>
  <text x="396.0" y="71.0" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="400" fill="#c3c2b7" text-anchor="start">at chance</text>
  <text x="24.0" y="260.0" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="400" fill="#c3c2b7" text-anchor="start">Positive class: tenant A probing a prefix tenant B planted. Negative: a prefix nobody planted.</text>
  <text x="24.0" y="276.0" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="400" fill="#c3c2b7" text-anchor="start">A CONFIRMATION oracle — the probe sends the victim's prompt verbatim, so a perfect match is by construction.</text>
  <text x="24.0" y="292.0" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="400" fill="#c3c2b7" text-anchor="start">It shows an attacker who can guess a prefix gets it confirmed. It does not show unknown content can be recovered.</text>
  <text x="24.0" y="308.0" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="400" fill="#c3c2b7" text-anchor="start">Both intervals are degenerate — every observation is identical — so they render as a tick. That is zero variance, not precision.</text>
</svg>
