<svg xmlns="http://www.w3.org/2000/svg" width="720" height="336" viewBox="0 0 720 336" role="img" aria-label="S-02: the interval narrowing as n grew">
  <title>S-02: the interval narrowing as n grew</title>
  <rect width="720" height="336" fill="#fcfcfb"/>
  <text x="24.0" y="30.0" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="600" fill="#0b0b0b" text-anchor="start">Why the sample size was fixed before the run that counted</text>
  <text x="24.0" y="50.0" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="400" fill="#52514e" text-anchor="start">S-02 latency channel, AUC with its 95% bootstrap interval</text>
  <line x1="307.9" y1="100.0" x2="307.9" y2="248.0" stroke="#dedddb" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="307.9" y="92.0" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="10" font-weight="400" fill="#52514e" text-anchor="middle">chance 0.5</text>
  <line x1="404.3" y1="100.0" x2="404.3" y2="248.0" stroke="#dedddb" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="404.3" y="92.0" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="10" font-weight="400" fill="#52514e" text-anchor="middle">pre-registered bar 0.75</text>
  <text x="236.0" y="138.0" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="400" fill="#0b0b0b" text-anchor="end">run #8  (n=62)</text>
  <rect x="273.1" y="130.0" width="111.6" height="8.0" rx="4.0" fill="#1baf7a"/>
  <line x1="329.7" y1="123.0" x2="329.7" y2="145.0" stroke="#1baf7a" stroke-width="2"/>
  <text x="534.0" y="138.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#52514e" text-anchor="start">AUC 0.5567  p=0.4526</text>
  <text x="236.0" y="182.0" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="400" fill="#0b0b0b" text-anchor="end">run #11  (n=62)</text>
  <rect x="298.8" y="174.0" width="108.3" height="8.0" rx="4.0" fill="#1baf7a"/>
  <line x1="354.2" y1="167.0" x2="354.2" y2="189.0" stroke="#1baf7a" stroke-width="2"/>
  <text x="534.0" y="182.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#52514e" text-anchor="start">AUC 0.6202  p=0.1061</text>
  <text x="236.0" y="226.0" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="400" fill="#0b0b0b" text-anchor="end">run #12  (n=402)</text>
  <rect x="308.9" y="218.0" width="42.9" height="8.0" rx="4.0" fill="#1baf7a"/>
  <line x1="330.3" y1="211.0" x2="330.3" y2="233.0" stroke="#1baf7a" stroke-width="2"/>
  <text x="534.0" y="226.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#52514e" text-anchor="start">AUC 0.5581  p=0.0425</text>
  <text x="24.0" y="284.0" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="400" fill="#52514e" text-anchor="start">Runs #8 and #11 both sat above chance with an interval straddling it. That is not evidence of no effect;</text>
  <text x="24.0" y="300.0" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="400" fill="#52514e" text-anchor="start">it is what n=62 looks like when it cannot resolve an effect of that size. n=402 was fixed in the workflow</text>
  <text x="24.0" y="316.0" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="400" fill="#52514e" text-anchor="start">BEFORE the run that got recorded, so the answer could not be reached by stopping when it looked convenient.</text>
</svg>
