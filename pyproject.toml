[project]
name = "provenance"
version = "0.1.0"
description = "Verifiable and tenant-isolated LLM inference for regulated environments"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.1",
    "scipy>=1.14",
    "cryptography>=43.0",
    "httpx>=0.27",
]

[project.scripts]
attest = "attest.receipt.cli:main"

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-cov>=5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["common", "attest", "barrier"]

# ---------------------------------------------------------------------------
# ruff — lint + format. T-002.
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "TID", "RUF"]
# N818 wants every exception to end in "Error". SignatureInvalid, HubUnreachable
# and SigningRefused describe the *condition* and read better at call sites, which
# is where exception names actually get read.
ignore = ["N818"]

# common/ is a leaf (LLD §2). It must never import from the workstream packages —
# doing so would couple ATTEST and BARRIER, which must ship independently (D-04).
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"attest".msg = "common/ is a leaf: it must not import from attest/ (LLD §2)."
"barrier".msg = "common/ is a leaf: it must not import from barrier/ (LLD §2)."

[tool.ruff.lint.per-file-ignores]
# The ban above applies only inside common/; everywhere else these imports are fine.
"attest/**" = ["TID251"]
"barrier/**" = ["TID251"]
"tests/**" = ["TID251"]
"scripts/**" = ["TID251", "E402"]

# ---------------------------------------------------------------------------
# mypy — strict where a silent type error would corrupt a published number.
# HLD §7.3.
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = false
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_reexport = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = ["common.*", "attest.receipt.*"]
strict = true

[[tool.mypy.overrides]]
module = ["scipy.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# pytest / coverage
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "integration: exercises more than one component (still no GPU, no cluster)",
    "slow: statistical calibration checks — seconds, not milliseconds",
]

[tool.coverage.run]
source = ["common", "attest", "barrier"]
branch = true

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
